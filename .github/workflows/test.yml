name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra test
      - name: Lint
        run: uv run ruff check app benchmarks tests scripts examples
      - name: Verify OpenAPI schema
        run: uv run python scripts/export_openapi.py --check
      - name: Run tests
        run: uv run pytest

